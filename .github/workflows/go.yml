# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  # every pull request, not only those into main: a stacked pull request has
  # another pull request's branch as its base and would otherwise get no checks
  pull_request:

jobs:

  test:
    # macOS is not redundant here: the config search path is
    # $HOME/Library/Application Support rather than XDG_CONFIG_HOME, and the
    # filesystem is case-insensitive, neither of which Linux exercises.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: build, lint and test (${{ matrix.os }})
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # follow the version the module declares rather than pinning it twice
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Check formatting
      # gofmt output does not vary by platform, so once is enough
      if: matrix.os == 'ubuntu-latest'
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Lint
      # like gofmt, the findings do not depend on the platform
      if: matrix.os == 'ubuntu-latest'
      # golangci-lint v2 needs v7 or later of the action. The linter version
      # is pinned to the one the code is checked with locally, so a new
      # release cannot fail CI with findings nobody has seen
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15

    - name: Test
      run: go test -race -v ./...
